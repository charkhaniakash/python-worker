[project]
name = "builderv2-worker"
version = "1.0.0"
description = "LiveKit Agent Worker for SIP/Twilio Calls (Python)"
requires-python = ">=3.11"
license = { text = "ISC" }
authors = [{ name = "CoRover" }]

dependencies = [
    "livekit-agents[deepgram,elevenlabs,google,openai,silero]>=1.0.0,<2.0.0",
    "livekit-plugins-noise-cancellation>=0.2.0,<0.3.0",
    "google-cloud-secret-manager>=2.20.0,<3.0.0",
    "pydantic>=2.6,<3.0",
    "pydantic-settings>=2.2,<3.0",
    "httpx[http2]>=0.27,<0.29",
    "pyyaml>=6.0,<7.0",
    "python-dotenv>=1.0,<2.0",
    "structlog>=24.1,<26.0",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.10",
    "ruff>=0.5",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "types-PyYAML",
]

[project.scripts]
worker = "worker.main:cli_main"

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/worker"]

[tool.hatch.build.targets.sdist]
include = ["src", "config", "pyproject.toml"]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
disallow_untyped_defs = true
mypy_path = "src"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
